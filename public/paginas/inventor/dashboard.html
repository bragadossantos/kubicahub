<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Painel do Inventor — Kubica Hub</title>
  <meta name="description" content="Painel de controlo do Inventor FKCU — acompanha os teus projectos, colaborações e métricas de impacto."/>
  <link rel="stylesheet" href="../../kubica.css"/>
</head>
<body class="page-body">

<div class="k-dash-layout">
  <!-- Sidebar injectada pelo JS -->
  <div id="k-sidebar-placeholder"></div>

  <div class="k-dash-main">
    <div id="k-header-placeholder"></div>

    <div class="k-dash-content">

      <!-- Page Header -->
      <div class="k-page-header">
        <div class="k-page-header__eyebrow">Inventor · FKCU</div>
        <h1 class="k-page-header__title" id="greeting">Bem-vindo ao Hub</h1>
        <p class="k-page-header__desc">O teu painel de controlo para acompanhar projectos, equipas e impacto.</p>
      </div>

      <!-- KPIs -->
      <div class="k-kpi-grid" id="kpi-grid">
        <div class="k-loading"><div class="k-spinner"></div></div>
      </div>

      <!-- Grid 2 colunas -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-16);" class="k-two-col">

        <!-- Projectos Recentes -->
        <div class="k-list-card">
          <div class="k-list-card__header">
            <h2 class="k-list-card__title">Os meus Projectos</h2>
            <a href="projetos.html" class="text-caption color-amber">Ver todos →</a>
          </div>
          <div class="k-list-card__body" id="projects-list">
            <div class="k-loading"><div class="k-spinner"></div></div>
          </div>
        </div>

        <!-- Actividade Recente / Notificações -->
        <div class="k-list-card">
          <div class="k-list-card__header">
            <h2 class="k-list-card__title">Actividade Recente</h2>
            <a href="notificacoes.html" class="text-caption color-amber">Ver todas →</a>
          </div>
          <div class="k-list-card__body" id="activity-list">
            <div class="k-loading"><div class="k-spinner"></div></div>
          </div>
        </div>
      </div>

      <!-- Startup em Incubação (se existir) -->
      <div id="startup-section" style="margin-top:var(--sp-16);display:none;">
        <div class="k-list-card">
          <div class="k-list-card__header">
            <h2 class="k-list-card__title"><span class="k-icon" style="margin-right:8px;vertical-align:-2px;"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg></span>Startup em Incubação</h2>
            <span class="k-badge k-badge--info" id="startup-phase">Em Co-Criação</span>
          </div>
          <div class="k-list-card__body" id="startup-details"></div>
        </div>
      </div>

    </div><!-- /.k-dash-content -->
  </div><!-- /.k-dash-main -->
</div><!-- /.k-dash-layout -->

<script src="../../assets/js/kubica.js"></script>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/kubica-dashboard.js"></script>
<script>
(async () => {
  await KubicaDash.init('inventor', 'dashboard');
  const user = KubicaDash.getUser();
  if (!user) return;

  document.getElementById('greeting').textContent = `Bem-vindo, ${(user.name || 'Inventor').split(' ')[0]}!`;

  // ── Carregar Ideias do Inventor ──────────────────────────
  try {
    const res = await KubicaApp.api('/ideas?inventor=me');
    const ideas = res?.data?.ideas ?? [];

    // KPIs
    const totalIdeas  = ideas.length;
    const approved    = ideas.filter(i => i.status === 'approved' || i.status === 'matched' || i.status === 'incubating').length;
    const incubating  = ideas.filter(i => i.status === 'incubating').length;

    document.getElementById('kpi-grid').innerHTML = `
      ${KubicaDash.kpiCard('Projectos Submetidos', totalIdeas, 'lightbulb')}
      ${KubicaDash.kpiCard('Aprovados FKCU', approved, '<span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span>')}
      ${KubicaDash.kpiCard('Em Incubação', incubating, '<span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg></span>')}
      ${KubicaDash.kpiCard('Universidade', user.university || 'UAN', '<span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 2.21 3.58 4 8 4s8-1.79 8-4v-5"/></svg></span>')}
    `;

    // Lista de projectos
    if (ideas.length === 0) {
      KubicaDash.showEmpty('projects-list', 'Ainda não submeteste nenhum projecto.', '<span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><line x1="9" y1="18" x2="15" y2="18"/><line x1="10" y1="22" x2="14" y2="22"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg></span>');
    } else {
      document.getElementById('projects-list').innerHTML = ideas.slice(0, 5).map(idea => `
        <div class="k-list-row">
          <div style="flex:1;">
            <div class="k-list-row__title">${idea.title}</div>
            <div class="k-list-row__meta">${idea.sector || 'Sector'} · ${KubicaDash.formatDate(idea.created_at)}</div>
          </div>
          <div>${KubicaDash.statusBadge(idea.status)}</div>
        </div>
      `).join('');
    }

    // Startup em incubação
    const activeIdea = ideas.find(i => i.status === 'incubating' || i.status === 'matched');
    if (activeIdea) {
      document.getElementById('startup-section').style.display = 'block';
      document.getElementById('startup-phase').textContent = activeIdea.status === 'incubating' ? '<span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg></span> Em Incubação' : '<span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="M20.42 4.58a5.4 5.4 0 0 0-7.65 0l-.77.78-.77-.78a5.4 5.4 0 0 0-7.65 7.65l.77.79L12 21l7.65-8.63.77-.79a5.4 5.4 0 0 0 0-7.4z"/></svg></span> Matched';
      document.getElementById('startup-details').innerHTML = `
        <div class="k-list-row">
          <span style="font-size:24px;"><span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><line x1="9" y1="18" x2="15" y2="18"/><line x1="10" y1="22" x2="14" y2="22"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg></span></span>
          <div style="flex:1;">
            <div class="k-list-row__title" style="margin-bottom:4px;">${activeIdea.title}</div>
            <div class="k-list-row__meta">${activeIdea.sector} · ${activeIdea.pdn_axis}</div>
          </div>
          <a href="projetos.html" class="btn-outline" style="font-size:12px;padding:6px 12px;">Ver detalhes →</a>
        </div>
      `;
    }
  } catch (e) {
    KubicaDash.showError('kpi-grid', 'Erro ao carregar métricas.');
    KubicaDash.showError('projects-list');
  }

  // ── Actividade Recente (Notificações) ────────────────────
  try {
    const nRes = await KubicaApp.api('/notifications?limite=5');
    const notifs = nRes?.data?.notifications ?? [];
    if (notifs.length === 0) {
      KubicaDash.showEmpty('activity-list', 'Sem actividade recente.', 'inbox');
    } else {
      document.getElementById('activity-list').innerHTML = notifs.map(n => `
        <div class="k-list-row" style="${!n.is_read ? 'border-left:2px solid var(--color-amber-forge);padding-left:10px;' : ''}">
          <div style="flex:1;">
            <div class="k-list-row__title" style="font-size:13px;">${n.title}</div>
            <div class="k-list-row__meta">${(n.message || '').substring(0, 65)}...</div>
          </div>
        </div>
      `).join('');
    }
  } catch(e) {
    KubicaDash.showEmpty('activity-list', 'Sem actividade recente.', 'inbox');
  }
})();
</script>
</body>
</html>
