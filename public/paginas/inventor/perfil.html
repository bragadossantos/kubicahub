<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"/>
  <link rel="alternate icon" type="image/x-icon" href="../../favicon.ico"/>
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png"/>
  <title>O meu Perfil — Kubica Hub</title>
  <link rel="stylesheet" href="../../kubica.css"/>
</head>
<body class="page-body">

<div class="k-dash-layout">
  <div id="k-sidebar-placeholder"></div>
  <div class="k-dash-main">
    <div id="k-header-placeholder"></div>
    <div class="k-dash-content">

      <div class="k-page-header">
        <div class="k-page-header__eyebrow">Perfil · FKCU</div>
        <h1 class="k-page-header__title">O meu Perfil</h1>
        <p class="k-page-header__desc">Mantém o teu perfil actualizado para aumentar a tua credibilidade perante co-fundadores e mentores.</p>
      </div>

      <div id="profile-container">
        <div class="k-loading"><div class="k-spinner"></div><p>A carregar perfil...</p></div>
      </div>

    </div>
  </div>
</div>

<script src="../../assets/js/kubica.js"></script>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/kubica-dashboard.js"></script>
<script>
(async () => {
  await KubicaDash.init(null, 'perfil');
  const user = KubicaDash.getUser();
  if (!user) return;

  try {
    const res = await KubicaApp.api('/profile/' + user.id);
    if (res && res.success) {
      renderProfile(res.data.profile, res.data.badges, res.data.stats);
    }
  } catch(e) {
    KubicaDash.showError('profile-container', 'Erro ao carregar dados do perfil.');
  }
})();

function renderProfile(profile, badges, stats) {
  const skills = Array.isArray(profile.skills) ? profile.skills : (profile.skills ? JSON.parse(profile.skills) : []);
  
  document.getElementById('profile-container').innerHTML = `
    <!-- Cabeçalho do Perfil -->
    <div class="k-list-card" style="margin-bottom:var(--sp-16);">
      <div class="k-list-card__body">
        <div style="display:flex;align-items:flex-start;gap:var(--sp-24);flex-wrap:wrap;">
          <div class="k-sidebar__avatar" style="width:72px;height:72px;font-size:28px;flex-shrink:0;">${(profile.name || 'U').charAt(0)}</div>
          <div style="flex:1;min-width:280px;">
            <h2 style="font-size:22px;font-weight:700;color:var(--color-warm-cream);margin:0 0 4px;">${profile.name}</h2>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:var(--sp-12);">
              <span class="k-badge k-badge--${profile.role}">${profile.role}</span>
              <span style="font-size:13px;color:var(--color-driftwood);"><span class="k-icon" style="margin-right:8px;vertical-align:-2px;"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 2.21 3.58 4 8 4s8-1.79 8-4v-5"/></svg></span>${profile.faculty} · ${profile.university}</span>
              ${profile.availability_hours ? `<span style="font-size:13px;color:var(--color-driftwood);">⏱ ${profile.availability_hours}h/semana</span>` : ''}
            </div>
            <p style="font-size:14px;color:var(--color-driftwood);margin:0;">${profile.bio || 'Sem biografia. Adiciona uma para descrever a tua visão e experiência!'}</p>
          </div>
        </div>

        <!-- Stats -->
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-16);margin-top:var(--sp-24);padding-top:var(--sp-16);border-top:1px solid var(--color-walnut);">
          <div style="text-align:center;">
            <div style="font-size:22px;font-weight:700;color:var(--color-warm-cream);">${stats.ideias_submetidas || 0}</div>
            <div style="font-size:12px;color:var(--color-driftwood);">Ideias Submetidas</div>
          </div>
          <div style="text-align:center;">
            <div style="font-size:22px;font-weight:700;color:var(--color-warm-cream);">${stats.propostas_aceites || 0}</div>
            <div style="font-size:12px;color:var(--color-driftwood);">Propostas Aceites</div>
          </div>
          <div style="text-align:center;">
            <div style="font-size:22px;font-weight:700;color:var(--color-warm-cream);">${stats.equipas_activas || 0}</div>
            <div style="font-size:12px;color:var(--color-driftwood);">Equipas Activas</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Skills -->
    <div class="k-list-card" style="margin-bottom:var(--sp-16);">
      <div class="k-list-card__header">
        <h3 class="k-list-card__title">Competências Técnicas & Negócio</h3>
      </div>
      <div class="k-list-card__body">
        ${skills.length ? skills.map(s => `<span class="k-badge k-badge--muted" style="margin:3px;">${s}</span>`).join('') : '<p style="font-size:13px;color:var(--color-driftwood);">Nenhuma competência registada.</p>'}
      </div>
    </div>

    <!-- Badges -->
    ${badges && badges.length ? `
    <div class="k-list-card" style="margin-bottom:var(--sp-16);">
      <div class="k-list-card__header">
        <h3 class="k-list-card__title"><span class="k-icon" style="margin-right:8px;vertical-align:-2px;"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg></span>Badges de Reconhecimento FKCU</h3>
      </div>
      <div class="k-list-card__body" style="display:flex;gap:var(--sp-12);flex-wrap:wrap;">
        ${badges.map(b => `<span class="k-badge k-badge--warning"><span class="k-icon" style="margin-right:8px;vertical-align:-2px;"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg></span>${b.badge_type.replace(/_/g,' ')}</span>`).join('')}
      </div>
    </div>` : ''}

    <!-- Edição -->
    <div class="k-form-section">
      <h3 class="k-form-section__title">Editar Dados do Perfil</h3>
      <div id="edit-feedback" style="display:none;margin-bottom:var(--sp-12);"></div>
      <div class="input-group">
        <label class="input-label">Biografia / Visão Pessoal</label>
        <textarea id="edit-bio" class="input-pill" rows="3" style="resize:vertical;">${profile.bio || ''}</textarea>
      </div>
      <div class="k-form-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-16);margin-top:var(--sp-12);">
        <div class="input-group">
          <label class="input-label">Horas disponíveis por semana</label>
          <input type="number" id="edit-hours" class="input-pill" min="0" max="40" value="${profile.availability_hours || ''}"/>
        </div>
        <div class="input-group">
          <label class="input-label">Papel de Co-Fundador Pretendido</label>
          <select id="edit-profile-type" class="select-pill">
            <option value="">Seleccionar</option>
            <option ${profile.profile_type==='CEO'?'selected':''}>CEO</option>
            <option ${profile.profile_type==='CTO'?'selected':''}>CTO</option>
            <option ${profile.profile_type==='CFO'?'selected':''}>CFO</option>
            <option ${profile.profile_type==='CLO'?'selected':''}>CLO</option>
            <option ${profile.profile_type==='CMO'?'selected':''}>CMO</option>
          </select>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:var(--sp-16);">
        <button class="btn-primary" onclick="saveProfile(${profile.id})">Guardar Alterações →</button>
      </div>
    </div>
  `;
}

async function saveProfile(userId) {
  const payload = {
    bio:              document.getElementById('edit-bio').value.trim(),
    availability_hours: parseInt(document.getElementById('edit-hours').value) || null,
    profile_type:     document.getElementById('edit-profile-type').value,
  };

  try {
    await KubicaApp.api('/profile/' + userId, 'PATCH', payload);
    document.getElementById('edit-feedback').style.display = 'block';
    document.getElementById('edit-feedback').innerHTML = '<div style="padding:10px 14px;background:rgba(74,222,128,0.12);border:1px solid #4ade80;border-radius:6px;color:#4ade80;font-size:13px;"><span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></span> Perfil actualizado com sucesso!</div>';
    KubicaDash.toast('Perfil actualizado com sucesso!', 'success');
  } catch(e) {
    document.getElementById('edit-feedback').style.display = 'block';
    document.getElementById('edit-feedback').innerHTML = '<div style="padding:10px 14px;background:rgba(248,113,113,0.12);border:1px solid #f87171;border-radius:6px;color:#f87171;font-size:13px;"><span class="k-icon" style="margin-right:8px;vertical-align:-2px;"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg></span>Erro ao guardar perfil.</div>';
  }
}
</script>
</body>
</html>
