<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Sandbox / Financiamento — Kubica Hub Admin</title>
  <link rel="stylesheet" href="../../kubica.css"/>
  <style>
    .k-filter-btn--active { border-color:var(--color-amber-forge)!important;color:var(--color-amber-forge)!important;background:var(--color-amber-dim)!important; }
  </style>
</head>
<body class="page-body">

<div class="k-dash-layout">
  <div id="k-sidebar-placeholder"></div>
  <div class="k-dash-main">
    <div id="k-header-placeholder"></div>
    <div class="k-dash-content">

      <div class="k-page-header">
        <div class="k-page-header__eyebrow">Admin · Funding Board FKCU</div>
        <h1 class="k-page-header__title">Sandbox & Disbursements</h1>
        <p class="k-page-header__desc">Gere e aprova as tranches de financiamento não-dilutivo solicitadas pelas equipas de startups em incubação.</p>
      </div>

      <!-- KPIs de sandbox -->
      <div class="k-kpi-grid" id="sandbox-kpis">
        <div class="k-loading"><div class="k-spinner"></div><p>A carregar dados financeiros...</p></div>
      </div>

      <div style="display:flex;gap:var(--sp-8);margin-bottom:var(--sp-24);">
        <button class="btn-outline k-filter-btn k-filter-btn--active" data-status="pending" onclick="switchTab('pending')"><span class="k-icon" style="margin-right:6px;"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>Pendentes</button>
        <button class="btn-outline k-filter-btn" data-status="approved" onclick="switchTab('approved')"><span class="k-icon" style="margin-right:6px;"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span>Aprovados</button>
        <button class="btn-outline k-filter-btn" data-status="rejected" onclick="switchTab('rejected')"><span class="k-icon" style="margin-right:6px;"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="15" x2="9" y1="9" y2="15"/><line x1="9" x2="15" y1="9" y2="15"/></svg></span>Rejeitados</button>
      </div>

      <div id="transactions-container">
        <div class="k-loading"><div class="k-spinner"></div><p>A carregar transacções...</p></div>
      </div>

    </div>
  </div>
</div>

<!-- Modal de Rejeição de Financiamento -->
<div id="reject-modal" class="k-modal-backdrop" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:999;align-items:center;justify-content:center;">
  <div class="k-modal" style="background:var(--color-midnight-cocoa);border:1px solid var(--color-walnut);border-radius:12px;padding:var(--sp-24);max-width:480px;width:90%;">
    <h2 class="k-modal__title" style="font-size:18px;color:var(--color-warm-cream);margin:0 0 12px;"><span class="k-icon" style="margin-right:8px;vertical-align:-2px;"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="15" x2="9" y1="9" y2="15"/><line x1="9" x2="15" y1="9" y2="15"/></svg></span>Rejeitar Pedido de Disbursement</h2>
    <input type="hidden" id="reject-txn-id"/>
    <div class="input-group">
      <label class="input-label">Motivo da Rejeição (Obrigatório)</label>
      <textarea id="reject-reason" class="input-pill" rows="3" placeholder="Ex: Montante acima do plafond previsto para a categoria seleccionada ou falta de comprovativos..."></textarea>
    </div>
    <div style="display:flex;gap:var(--sp-12);justify-content:flex-end;margin-top:var(--sp-16);">
      <button class="btn-outline" onclick="document.getElementById('reject-modal').style.display='none'">Cancelar</button>
      <button class="btn-outline" style="color:#f87171;border-color:#f87171;" onclick="confirmReject()">Confirmar Rejeição</button>
    </div>
  </div>
</div>

<script src="../../assets/js/kubica.js"></script>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/kubica-dashboard.js"></script>
<script>
let allTxns = [], currentTab = 'pending';

(async () => {
  await KubicaDash.init('admin', 'relatorios');
  await loadTransactions();
})();

async function loadTransactions() {
  try {
    const res = await KubicaApp.api('/admin/sandbox/pending');
    allTxns = res?.data?.transactions ?? [];

    const totalPending  = allTxns.filter(t => t.status === 'pending').reduce((s, t) => s + parseFloat(t.amount_usd || 0), 0);
    const totalApproved = allTxns.filter(t => t.status === 'approved').reduce((s, t) => s + parseFloat(t.amount_usd || 0), 0);
    const countPending  = allTxns.filter(t => t.status === 'pending').length;

    document.getElementById('sandbox-kpis').innerHTML = `
      ${KubicaDash.kpiCard('Pedidos Pendentes', countPending, '<span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>')}
      ${KubicaDash.kpiCard('Volume Pendente', KubicaDash.formatCurrency(totalPending), '<span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></svg></span>')}
      ${KubicaDash.kpiCard('Volume Processado', KubicaDash.formatCurrency(totalApproved), '<span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span>')}
    `;

    renderByStatus('pending');
  } catch(e) {
    KubicaDash.showError('transactions-container', 'Erro ao carregar transacções.');
    KubicaDash.showError('sandbox-kpis');
  }
}

function switchTab(status) {
  currentTab = status;
  document.querySelectorAll('.k-filter-btn').forEach(b => b.classList.toggle('k-filter-btn--active', b.dataset.status === status));
  renderByStatus(status);
}

function renderByStatus(status) {
  const filtered = allTxns.filter(t => t.status === status);
  if (!filtered.length) {
    KubicaDash.showEmpty('transactions-container', `Sem transacções ${status === 'pending' ? 'pendentes' : status}.`, '<span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></svg></span>');
    return;
  }
  document.getElementById('transactions-container').innerHTML = filtered.map(t => `
    <div class="k-list-card" style="margin-bottom:var(--sp-12);">
      <div class="k-list-card__body">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-16);flex-wrap:wrap;">
          <div style="flex:1;min-width:280px;">
            <div style="display:flex;align-items:center;gap:var(--sp-8);margin-bottom:var(--sp-8);">
              <span style="font-size:20px;font-weight:700;color:var(--color-amber-forge);">${KubicaDash.formatCurrency(t.amount_usd)}</span>
              ${KubicaDash.statusBadge(t.status)}
            </div>
            <p style="font-size:14px;color:var(--color-warm-cream);margin:0 0 var(--sp-8);font-weight:500;">${t.description}</p>
            <div style="display:flex;gap:var(--sp-16);font-size:12px;color:var(--color-driftwood);flex-wrap:wrap;">
              <span><span class="k-icon" style="margin-right:8px;vertical-align:-2px;"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/><circle cx="12" cy="13" r="2"/><path d="M12 15v3"/></svg></span>Categoria: ${t.category}</span>
              <span><span class="k-icon" style="margin-right:8px;vertical-align:-2px;"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="M20.42 4.58a5.4 5.4 0 0 0-7.65 0l-.77.78-.77-.78a5.4 5.4 0 0 0-7.65 7.65l.77.79L12 21l7.65-8.63.77-.79a5.4 5.4 0 0 0 0-7.4z"/></svg></span>Equipa: ${t.team_name || 'Equipa FKCU'}</span>
              <span><span class="k-icon" style="margin-right:8px;vertical-align:-2px;"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>Solicitado por: ${t.requester_name || 'Membro'}</span>
              <span><span class="k-icon" style="margin-right:8px;vertical-align:-2px;"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg></span>${KubicaDash.formatDate(t.requested_at)}</span>
              ${t.reject_reason ? `<span style="color:#f87171;">Motivo: ${t.reject_reason}</span>` : ''}
            </div>
          </div>
          ${t.status === 'pending' ? `
          <div style="display:flex;flex-direction:column;gap:var(--sp-8);flex-shrink:0;">
            <button class="btn-primary" style="font-size:12px;padding:6px 14px;" onclick="approve(${t.id})"><span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></span> Aprovar Disbursement</button>
            <button class="btn-outline" style="font-size:12px;padding:6px 14px;color:#f87171;border-color:#f87171;" onclick="openReject(${t.id})"><span class="k-icon" style="margin-right:4px;vertical-align:-1px;"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg></span>Rejeitar</button>
          </div>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

async function approve(txnId) {
  if (!confirm('Aprovar este pedido de financiamento Sandbox? O saldo será debitado e notificado à equipa.')) return;
  try {
    await KubicaApp.api('/admin/sandbox/' + txnId + '/approve', 'PATCH', {});
    KubicaDash.toast('<span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span> Disbursement Sandbox aprovado com sucesso!', 'success');
    await loadTransactions();
  } catch(e) {
    KubicaDash.toast('Erro ao aprovar financiamento.', 'error');
  }
}

function openReject(txnId) {
  document.getElementById('reject-txn-id').value = txnId;
  document.getElementById('reject-reason').value = '';
  document.getElementById('reject-modal').style.display = 'flex';
}

async function confirmReject() {
  const txnId  = document.getElementById('reject-txn-id').value;
  const reason = document.getElementById('reject-reason').value.trim();
  if (!reason) { 
    alert('O motivo de rejeição é obrigatório.'); 
    return; 
  }
  try {
    await KubicaApp.api('/admin/sandbox/' + txnId + '/reject', 'PATCH', { reject_reason: reason });
    KubicaDash.toast('<span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="15" x2="9" y1="9" y2="15"/><line x1="9" x2="15" y1="9" y2="15"/></svg></span> Pedido de financiamento rejeitado.', 'info');
    document.getElementById('reject-modal').style.display = 'none';
    await loadTransactions();
  } catch(e) {
    KubicaDash.toast('Erro ao rejeitar pedido.', 'error');
  }
}
</script>
</body>
</html>
