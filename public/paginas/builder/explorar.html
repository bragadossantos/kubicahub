<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"/>
  <link rel="alternate icon" type="image/x-icon" href="../../favicon.ico"/>
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png"/>
  <title>Explorar Ideias — Kubica Hub</title>
  <link rel="stylesheet" href="../../kubica.css"/>
</head>
<body class="page-body">

<div class="k-dash-layout">
  <div id="k-sidebar-placeholder"></div>
  <div class="k-dash-main">
    <div id="k-header-placeholder"></div>
    <div class="k-dash-content">

      <div class="k-page-header">
        <div class="k-page-header__eyebrow">Builder · Explorar</div>
        <h1 class="k-page-header__title">Banco de Ideias FKCU</h1>
        <p class="k-page-header__desc">Explora as ideias aprovadas pela coordenação e junta-te como co-fundador nas áreas de Tecnologia, Gestão, Direito e Marketing.</p>
      </div>

      <!-- Filtros -->
      <div class="k-form-section" style="margin-bottom:var(--sp-24);">
        <div class="k-form-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-16);">
          <div class="input-group">
            <label class="input-label" for="filter-sector">Sector de Actividade</label>
            <select id="filter-sector" class="select-pill" onchange="loadIdeas()">
              <option value="">Todos os sectores</option>
              <option>Agritech</option><option>Fintech</option><option>Healthtech</option>
              <option>Edtech</option><option>Energia</option><option>Logística</option>
              <option>Turismo</option><option>E-Commerce</option>
            </select>
          </div>
          <div class="input-group">
            <label class="input-label" for="filter-role">Papel pretendido</label>
            <select id="filter-role" class="select-pill" onchange="applyFilters()">
              <option value="">Todos os papéis</option>
              <option value="CTO"><span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2M9 2v2M20 15h2M20 9h2M9 20v2M15 20v2M2 9h2M2 15h2"/></svg></span> CTO — Tecnologia / Engenharia</option>
              <option value="CFO"><span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span> CFO — Finanças / Gestão</option>
              <option value="CLO"><span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg></span> CLO — Jurídico / Direito</option>
              <option value="CMO"><span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="m3 11 18-5v12L3 13v-2z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></span> CMO — Marketing / Comunicação</option>
            </select>
          </div>
        </div>
      </div>

      <div id="ideas-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:var(--sp-16);">
        <div class="k-loading" style="grid-column:span 3;"><div class="k-spinner"></div><p>A carregar ideias...</p></div>
      </div>
    </div>
  </div>
</div>

<script src="../../assets/js/kubica.js"></script>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/kubica-dashboard.js"></script>
<script>
let allIdeas = [];

(async () => {
  await KubicaDash.init('builder', 'explorar');
  await loadIdeas();
})();

async function loadIdeas() {
  const sector = document.getElementById('filter-sector').value;
  let url = '/ideas?status=approved';
  if (sector) url += '&sector=' + encodeURIComponent(sector);

  KubicaDash.showLoading('ideas-grid');
  try {
    const res = await KubicaApp.api(url);
    allIdeas = res?.data?.ideas ?? [];
    applyFilters();
  } catch(e) {
    document.getElementById('ideas-grid').innerHTML = '<div class="k-error-block" style="grid-column:span 3;"><p><span class="k-icon" style="margin-right:8px;vertical-align:-2px;"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg></span>Erro ao carregar banco de ideias.</p></div>';
  }
}

function applyFilters() {
  const roleFilter = document.getElementById('filter-role').value;
  let filtered = allIdeas;
  if (roleFilter) {
    filtered = filtered.filter(i => {
      const roles = Array.isArray(i.roles_needed) ? i.roles_needed : JSON.parse(i.roles_needed || '[]');
      return roles.includes(roleFilter);
    });
  }
  renderIdeas(filtered);
}

function renderIdeas(ideas) {
  if (!ideas.length) {
    document.getElementById('ideas-grid').innerHTML = '<div class="k-empty" style="grid-column:span 3;"><span class="k-empty__icon"><span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><line x1="9" y1="18" x2="15" y2="18"/><line x1="10" y1="22" x2="14" y2="22"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg></span></span><p>Nenhuma ideia encontrada para estes filtros.</p></div>';
    return;
  }

  document.getElementById('ideas-grid').innerHTML = ideas.map(idea => {
    const roles = Array.isArray(idea.roles_needed) ? idea.roles_needed : JSON.parse(idea.roles_needed || '[]');
    return `
      <div class="k-list-card">
        <div class="k-list-card__body">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-8);">
            <span style="font-size:11px;color:var(--color-amber-forge);font-weight:600;text-transform:uppercase;letter-spacing:.5px;">${idea.sector}</span>
            <span style="font-size:11px;color:var(--color-driftwood);">${KubicaDash.formatDate(idea.created_at)}</span>
          </div>
          <h3 style="font-size:16px;font-weight:700;color:var(--color-warm-cream);margin:0 0 var(--sp-8);">${idea.title}</h3>
          <p style="font-size:13px;color:var(--color-driftwood);margin:0 0 var(--sp-12);line-height:1.5;">${(idea.problem || '').substring(0, 130)}...</p>
          <div style="margin-bottom:var(--sp-12);">
            <div style="font-size:11px;color:var(--color-driftwood);margin-bottom:6px;">Papéis necessários na equipa:</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              ${roles.length ? roles.map(r => `<span class="k-badge k-badge--info">${r}</span>`).join('') : '<span class="k-badge k-badge--muted">Equipa aberta</span>'}
            </div>
          </div>
          <div style="font-size:11px;color:var(--color-driftwood);margin-bottom:var(--sp-16);"><span class="k-icon" style="margin-right:8px;vertical-align:-2px;"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></span>${idea.pdn_axis}</div>
          <div style="display:flex;align-items:center;justify-content:space-between;padding-top:var(--sp-8);border-top:1px solid rgba(67,57,45,0.4);">
            <span style="font-size:12px;color:var(--color-driftwood);"><span class="k-icon" style="margin-right:8px;vertical-align:-2px;"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>${idea.inventor_name || 'Inventor FKCU'}</span>
            <a href="propostas.html" class="btn-primary" style="font-size:12px;padding:6px 12px;">Ver Propostas →</a>
          </div>
        </div>
      </div>
    `;
  }).join('');
}
</script>
</body>
</html>
