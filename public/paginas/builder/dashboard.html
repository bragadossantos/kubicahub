<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"/>
  <link rel="alternate icon" type="image/x-icon" href="../../favicon.ico"/>
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png"/>
  <title>Painel do Builder — Kubica Hub</title>
  <link rel="stylesheet" href="../../kubica.css"/>
</head>
<body class="page-body">

<div class="k-dash-layout">
  <div id="k-sidebar-placeholder"></div>
  <div class="k-dash-main">
    <div id="k-header-placeholder"></div>
    <div class="k-dash-content">

      <div class="k-page-header">
        <div class="k-page-header__eyebrow">Builder · FKCU</div>
        <h1 class="k-page-header__title" id="greeting">Painel do Builder</h1>
        <p class="k-page-header__desc">Acompanha as tuas propostas, projectos activos e contribuições de co-criação.</p>
      </div>

      <!-- KPIs -->
      <div class="k-kpi-grid" id="kpi-grid">
        <div class="k-loading"><div class="k-spinner"></div></div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-16);" class="k-two-col">

        <!-- Propostas pendentes -->
        <div class="k-list-card">
          <div class="k-list-card__header">
            <h2 class="k-list-card__title">Propostas Recebidas</h2>
            <a href="propostas.html" class="text-caption color-amber">Ver todas →</a>
          </div>
          <div class="k-list-card__body" id="proposals-list">
            <div class="k-loading"><div class="k-spinner"></div></div>
          </div>
        </div>

        <!-- Projectos activos -->
        <div class="k-list-card">
          <div class="k-list-card__header">
            <h2 class="k-list-card__title">Projectos Activos</h2>
            <a href="projetos-activos.html" class="text-caption color-amber">Ver todos →</a>
          </div>
          <div class="k-list-card__body" id="active-projects">
            <div class="k-loading"><div class="k-spinner"></div></div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="../../assets/js/kubica.js"></script>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/kubica-dashboard.js"></script>
<script>
(async () => {
  await KubicaDash.init('builder', 'dashboard');
  const user = KubicaDash.getUser();
  if (!user) return;

  document.getElementById('greeting').textContent = `Painel de ${(user.name || 'Builder').split(' ')[0]}`;

  try {
    const res = await KubicaApp.api('/proposals');
    const proposals = res?.data?.proposals ?? [];

    const pendingCount  = proposals.filter(p => p.status === 'pending').length;
    const acceptedCount = proposals.filter(p => p.status === 'accepted').length;

    document.getElementById('kpi-grid').innerHTML = `
      ${KubicaDash.kpiCard('Propostas Pendentes', pendingCount, '<span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg></span>')}
      ${KubicaDash.kpiCard('Propostas Aceites', acceptedCount, '<span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span>')}
      ${KubicaDash.kpiCard('Faculdade', user.faculty || 'Engenharia', '<span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 2.21 3.58 4 8 4s8-1.79 8-4v-5"/></svg></span>')}
      ${KubicaDash.kpiCard('Universidade', user.university || 'UAN', '<span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><line x1="2" x2="22" y1="22" y2="22"/><line x1="6" x2="6" y1="18"/><line x1="10" x2="10" y1="18"/><line x1="14" x2="14" y1="18"/><line x1="18" x2="18" y1="18"/><polygon points="12 2 20 7 4 7"/></svg></span>')}
    `;

    // Lista de propostas
    const pendingProposals = proposals.filter(p => p.status === 'pending').slice(0, 4);
    if (!pendingProposals.length) {
      KubicaDash.showEmpty('proposals-list', 'Sem propostas pendentes de momento.', '<span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg></span>');
    } else {
      document.getElementById('proposals-list').innerHTML = pendingProposals.map(p => `
        <div class="k-list-row">
          <div style="flex:1;">
            <div class="k-list-row__title">${p.idea_title || 'Projecto FKCU'}</div>
            <div class="k-list-row__meta">${p.inventor_name || 'Inventor'} · ${p.equity_pct}% equity</div>
          </div>
          <span class="k-badge k-badge--info">${p.proposed_role}</span>
        </div>
      `).join('');
    }

    // Projectos activos
    const acceptedProposals = proposals.filter(p => p.status === 'accepted').slice(0, 4);
    if (!acceptedProposals.length) {
      KubicaDash.showEmpty('active-projects', 'Ainda não tens projectos activos. Explora o Banco de Ideias!', '<span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg></span>');
    } else {
      document.getElementById('active-projects').innerHTML = acceptedProposals.map(p => `
        <div class="k-list-row">
          <div style="flex:1;">
            <div class="k-list-row__title">${p.idea_title || 'Projecto'}</div>
            <div class="k-list-row__meta">${p.proposed_role} · ${p.equity_pct}% equity</div>
          </div>
          <span class="k-badge k-badge--success">Incubação</span>
        </div>
      `).join('');
    }
  } catch(e) {
    KubicaDash.showError('kpi-grid', 'Erro ao carregar dados.');
  }
})();
</script>
</body>
</html>
