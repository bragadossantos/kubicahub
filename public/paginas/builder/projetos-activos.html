<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Projectos Activos — Kubica Hub</title>
  <link rel="stylesheet" href="../../kubica.css"/>
</head>
<body class="page-body">

<div class="k-dash-layout">
  <div id="k-sidebar-placeholder"></div>
  <div class="k-dash-main">
    <div id="k-header-placeholder"></div>
    <div class="k-dash-content">

      <div class="k-page-header">
        <div class="k-page-header__eyebrow">Builder · Incubação FKCU</div>
        <h1 class="k-page-header__title">Projectos Activos</h1>
        <p class="k-page-header__desc">Acompanha os entregáveis, governança e o progresso das startups onde és co-fundador.</p>
      </div>

      <div id="projects-container">
        <div class="k-loading"><div class="k-spinner"></div><p>A carregar projectos activos...</p></div>
      </div>

    </div>
  </div>
</div>

<!-- Modal de Upload de Entregável -->
<div id="upload-modal" class="k-modal-backdrop" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:999;align-items:center;justify-content:center;">
  <div class="k-modal" style="background:var(--color-midnight-cocoa);border:1px solid var(--color-walnut);border-radius:12px;padding:var(--sp-24);max-width:480px;width:90%;">
    <h2 class="k-modal__title" style="font-size:18px;color:var(--color-warm-cream);margin:0 0 16px;">Submeter Entregável</h2>
    <div id="upload-feedback" style="display:none;margin-bottom:var(--sp-12);"></div>
    <input type="hidden" id="upload-team-id"/>
    
    <div class="input-group">
      <label class="input-label">Título do Entregável *</label>
      <input type="text" id="upload-title" class="input-pill" placeholder="Ex: Arquitectura de Sistema v1.0 / Modelo Financeiro"/>
    </div>
    <div class="input-group" style="margin-top:var(--sp-12);">
      <label class="input-label">Descrição dos Resultados</label>
      <textarea id="upload-desc" class="input-pill" rows="3" placeholder="Descreve o trabalho realizado e os marcos atingidos..."></textarea>
    </div>
    <div class="input-group" style="margin-top:var(--sp-12);">
      <label class="input-label">Papel Responsável</label>
      <select id="upload-role" class="select-pill">
        <option value="CTO">CTO — Tecnologia</option>
        <option value="CFO">CFO — Finanças</option>
        <option value="CLO">CLO — Jurídico</option>
        <option value="CMO">CMO — Marketing</option>
      </select>
    </div>
    <div style="display:flex;gap:var(--sp-12);justify-content:flex-end;margin-top:var(--sp-16);">
      <button class="btn-outline" onclick="document.getElementById('upload-modal').style.display='none'">Cancelar</button>
      <button class="btn-primary" onclick="submitDeliverable()">Submeter Entregável →</button>
    </div>
  </div>
</div>

<script src="../../assets/js/kubica.js"></script>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/kubica-dashboard.js"></script>
<script>
(async () => {
  await KubicaDash.init('builder', 'projetos-activos');
  await loadActiveProjects();
})();

async function loadActiveProjects() {
  try {
    const pRes = await KubicaApp.api('/proposals');
    const accepted = (pRes?.data?.proposals ?? []).filter(p => p.status === 'accepted');

    if (!accepted.length) {
      KubicaDash.showEmpty('projects-container', 'Ainda não és membro de nenhuma equipa FKCU. Aceita uma proposta para começar a co-criar!', '<span class="k-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg></span>');
      return;
    }

    const cards = await Promise.all(accepted.map(async p => {
      try {
        const dRes = await KubicaApp.api('/startups/' + p.idea_id + '/deliverables');
        const deliverables = dRes?.data?.deliverables ?? [];
        return { proposal: p, deliverables };
      } catch { return { proposal: p, deliverables: [] }; }
    }));

    document.getElementById('projects-container').innerHTML = cards.map(({ proposal: p, deliverables }) => `
      <div class="k-list-card" style="margin-bottom:var(--sp-16);">
        <div class="k-list-card__header">
          <div>
            <h2 class="k-list-card__title">${p.idea_title || 'Startup FKCU'}</h2>
            <div style="font-size:12px;color:var(--color-driftwood);margin-top:4px;">
              <span class="k-badge k-badge--info">${p.proposed_role}</span>
              <span style="margin-left:8px;">Equity: ${p.equity_pct}%</span>
              <span style="margin-left:8px;">Fase: Co-Criação</span>
            </div>
          </div>
          <button class="btn-primary" style="font-size:12px;padding:7px 14px;" onclick="openUpload(${p.idea_id}, '${p.proposed_role}')">＋ Submeter Entregável</button>
        </div>
        <div class="k-list-card__body">
          <div style="font-size:13px;font-weight:600;color:var(--color-warm-cream);margin-bottom:var(--sp-12);">Entregáveis Submetidos</div>
          ${deliverables.length ? deliverables.map(d => `
            <div class="k-list-row">
              <div style="flex:1;">
                <div class="k-list-row__title">${d.title}</div>
                <div class="k-list-row__meta">${d.description ? d.description.substring(0, 80) + '...' : 'Sem descrição'}</div>
              </div>
              <span class="k-badge k-badge--muted">${d.role}</span>
              ${KubicaDash.statusBadge(d.status)}
              <span class="k-list-row__meta">${KubicaDash.formatDate(d.submitted_at)}</span>
            </div>
          `).join('') : `<p style="font-size:13px;color:var(--color-driftwood);">Nenhum entregável submetido ainda. Clica em 'Submeter Entregável' para registar o teu progresso.</p>`}
        </div>
      </div>
    `).join('');
  } catch(e) {
    KubicaDash.showError('projects-container', 'Erro ao carregar equipas activas.');
  }
}

function openUpload(teamId, role) {
  document.getElementById('upload-team-id').value = teamId;
  document.getElementById('upload-title').value = '';
  document.getElementById('upload-desc').value = '';
  if (role) document.getElementById('upload-role').value = role;
  document.getElementById('upload-feedback').style.display = 'none';
  document.getElementById('upload-modal').style.display = 'flex';
}

async function submitDeliverable() {
  const teamId = document.getElementById('upload-team-id').value;
  const payload = {
    title:       document.getElementById('upload-title').value.trim(),
    description: document.getElementById('upload-desc').value.trim(),
    role:        document.getElementById('upload-role').value,
  };

  if (!payload.title) {
    document.getElementById('upload-feedback').style.display = 'block';
    document.getElementById('upload-feedback').innerHTML = '<div style="color:#f87171;font-size:13px;"><span class="k-icon" style="margin-right:8px;vertical-align:-2px;"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg></span>Título obrigatório.</div>';
    return;
  }

  try {
    const res = await KubicaApp.api('/startups/' + teamId + '/deliverables', 'POST', payload);
    if (res && res.success) {
      KubicaDash.toast('Entregável submetido com sucesso para revisão!', 'success');
      document.getElementById('upload-modal').style.display = 'none';
      await loadActiveProjects();
    }
  } catch(err) {
    document.getElementById('upload-feedback').style.display = 'block';
    document.getElementById('upload-feedback').innerHTML = `<div style="color:#f87171;font-size:13px;"><span class="k-icon" style="margin-right:8px;vertical-align:-2px;"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="k-icon-svg" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg></span>${err?.data?.message || 'Erro ao submeter.'}</div>`;
  }
}
</script>
</body>
</html>
